<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Eryvia">
  <title>Eryvia</title>
  <defs>
    <linearGradient id="eryviaMark" x1="10" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6" />
      <stop offset="0.52" stop-color="#6D3EF0" />
      <stop offset="1" stop-color="#4318C9" />
    </linearGradient>
    <linearGradient id="eryviaSpark" x1="26" y1="24" x2="44" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#C9B6FF" />
    </linearGradient>
  </defs>

  <!-- The bowl: a squared-off C, open to the right. -->
  <path
    d="M47 13 H31 A19 19 0 1 0 31 51 H47"
    fill="none"
    stroke="url(#eryviaMark)"
    stroke-width="12.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- The middle arm, which is what turns the C into an E. -->
  <path
    d="M30 32 H44"
    fill="none"
    stroke="url(#eryviaMark)"
    stroke-width="11.5"
    stroke-linecap="round"
  />

  <!-- The spark, sitting where the arm meets the bowl. -->
  <path
    d="M33.5 22.5 C34.2 28.6 36.9 31.3 43 32 C36.9 32.7 34.2 35.4 33.5 41.5 C32.8 35.4 30.1 32.7 24 32 C30.1 31.3 32.8 28.6 33.5 22.5 Z"
    fill="url(#eryviaSpark)"
  />
</svg>
