<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Eryvia">
  <title>Eryvia</title>
  <defs>
    <linearGradient id="eryviaMark" x1="10" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6" />
      <stop offset="0.52" stop-color="#6D3EF0" />
      <stop offset="1" stop-color="#4318C9" />
    </linearGradient>
  </defs>

  <!-- The bowl: a squared-off C, open to the right. -->
  <path
    d="M47 13 H31 A19 19 0 1 0 31 51 H47"
    fill="none"
    stroke="url(#eryviaMark)"
    stroke-width="12.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- The middle arm, which is what turns the C into an E. -->
  <path
    d="M28 32 H45"
    fill="none"
    stroke="url(#eryviaMark)"
    stroke-width="11.5"
    stroke-linecap="round"
  />
</svg>
