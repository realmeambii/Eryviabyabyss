<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="Eryvia by Abyss — lessons, assignments, quizzes, grades and reports for JSS1–SS3."
    />
    <link rel="icon" type="image/svg+xml" href="/brand/eryvia-mark.svg" />
    <link rel="apple-touch-icon" href="/brand/eryvia-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Eryvia by Abyss</title>
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('gnaschools.theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (_) {
          /* private mode / storage disabled — fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Eryvia requires JavaScript to be enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
